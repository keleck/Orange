name: Build macOS (test)

# 测试版专用：只打包 macOS，不创建 Release、不占用 v* 正式发版流程。
# 触发方式：
#   1. 推送 mac-* 标签（如 git tag mac-2.7.73 && git push origin mac-2.7.73）
#   2. Actions 页面手动 Run workflow
# 产物：Actions 页面的 macos-test artifact（dmg），不发布到 Releases。

on:
  push:
    tags:
      - 'mac-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.5'
  GO_VERSION: '1.25.x'

concurrency:
  group: build-macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Clean Swift Package Manager cache
        run: |
          find macos -name "Package.resolved" -delete || true
          rm -rf macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/ || true
          rm -rf macos/Runner.xcworkspace/xcshareddata/swiftpm/ || true

      - name: Prepare app config
        shell: bash
        env:
          XBOARD_CONFIG: ${{ secrets.XBOARD_CONFIG }}
        run: |
          mkdir -p assets/config
          if [ -n "$XBOARD_CONFIG" ]; then
            echo "$XBOARD_CONFIG" | base64 --decode > assets/config/xboard.config.yaml
            echo "==> 使用 XBOARD_CONFIG 密钥注入配置"
          elif [ ! -f assets/config/xboard.config.yaml ]; then
            cp assets/config/xboard.config.example.yaml assets/config/xboard.config.yaml
            echo "==> 未配置 XBOARD_CONFIG，使用示例配置占位"
          fi

      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate SDK code
        run: |
          cd lib/sdk/flutter_xboard_sdk
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ../../..

      - name: Generate project code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Read version
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本：$v"

      - name: Build universal DMG
        run: dart setup.dart macos --universal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-${{ steps.ver.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error
