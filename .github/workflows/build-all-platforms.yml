name: Build All Platforms

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android'
        required: false
        default: 'true'
      build_ios:
        description: 'Build iOS'
        required: false
        default: 'true'
      build_macos:
        description: 'Build macOS'
        required: false
        default: 'true'
      build_windows:
        description: 'Build Windows'
        required: false
        default: 'true'
      build_linux:
        description: 'Build Linux'
        required: false
        default: 'true'

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # Android 构建任务
  build-android:
    if: github.event.inputs.build_android != 'false'
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: 设置 Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: 设置 Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 获取依赖
      run: flutter pub get
    
    - name: 构建 APK
      run: |
        flutter build apk --release --split-per-abi
        flutter build appbundle --release
    
    - name: 上传 Android 构建产物
      uses: actions/upload-artifact@v4
      with:
        name: android-builds
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/bundle/release/*.aab
        retention-days: 30

  # iOS 构建任务
  build-ios:
    if: github.event.inputs.build_ios != 'false'
    runs-on: macos-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: 设置 Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 获取依赖
      run: flutter pub get
    
    - name: 构建 iOS (无签名)
      run: flutter build ios --release --no-codesign
    
    - name: 上传 iOS 构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ios-builds
        path: build/ios/iphoneos/*.app
        retention-days: 30

  # macOS 构建任务
  build-macos:
    if: github.event.inputs.build_macos != 'false'
    runs-on: macos-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: 设置 Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 获取依赖
      run: flutter pub get
    
    - name: 构建 macOS
      run: flutter build macos --release
    
    - name: 打包 DMG
      if: contains(github.ref, 'refs/tags/')
      run: |
        if grep -q "flutter_distributor" pubspec.yaml; then
          dart pub global activate flutter_distributor
          flutter_distributor package --platform macos --targets dmg
        fi
    
    - name: 上传 macOS 构建产物
      uses: actions/upload-artifact@v4
      with:
        name: macos-builds
        path: |
          build/macos/Build/Products/Release/*.app
          dist/**/*.dmg
        retention-days: 30

  # Windows 构建任务
  build-windows:
    if: github.event.inputs.build_windows != 'false'
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: 设置 Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 获取依赖
      run: flutter pub get
    
    - name: 构建 Windows
      run: flutter build windows --release
    
    - name: 打包 EXE
      if: contains(github.ref, 'refs/tags/')
      run: |
        dart pub global activate flutter_distributor
        flutter_distributor package --platform windows --targets exe
    
    - name: 上传 Windows 构建产物
      uses: actions/upload-artifact@v4
      with:
        name: windows-builds
        path: |
          build/windows/x64/runner/Release/
          dist/**/*.exe
        retention-days: 30

  # Linux 构建任务
  build-linux:
    if: github.event.inputs.build_linux != 'false'
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    
    - name: 设置 Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 获取依赖
      run: flutter pub get
    
    - name: 构建 Linux
      run: flutter build linux --release
    
    - name: 打包 AppImage/DEB
      if: contains(github.ref, 'refs/tags/')
      run: |
        dart pub global activate flutter_distributor
        flutter_distributor package --platform linux --targets appimage,deb
    
    - name: 上传 Linux 构建产物
      uses: actions/upload-artifact@v4
      with:
        name: linux-builds
        path: |
          build/linux/x64/release/bundle/
          dist/**/*.AppImage
          dist/**/*.deb
        retention-days: 30

  # 发布任务（仅在打标签时）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    
    steps:
    - name: 下载所有构建产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: 创建 Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/android-builds/*.apk
          artifacts/android-builds/*.aab
          artifacts/macos-builds/**/*.dmg
          artifacts/windows-builds/**/*.exe
          artifacts/linux-builds/**/*.AppImage
          artifacts/linux-builds/**/*.deb
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
