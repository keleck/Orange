name: 多平台打包发布

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 标签时触发（如 v1.0.0）
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: '版本号（可选）'
        required: false
        default: ''

jobs:
  build-windows:
    name: 构建 Windows 版本
    runs-on: windows-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: 获取依赖
        run: flutter pub get
      
      - name: 构建 Windows 应用
        run: flutter build windows --release
      
      - name: 打包 Windows 产物
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../../fl_clash-windows-x64.zip
      
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: fl_clash-windows-x64.zip
          retention-days: 30

  build-android:
    name: 构建 Android 版本
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: 获取依赖
        run: flutter pub get
      
      - name: 构建 Android APK
        run: flutter build apk --release --split-per-abi
      
      - name: 构建 Android App Bundle
        run: flutter build appbundle --release
      
      - name: 重命名产物
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/fl_clash-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/fl_clash-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/fl_clash-x86_64.apk || true
          cp build/app/outputs/bundle/release/app-release.aab artifacts/fl_clash.aab || true
      
      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/*
          retention-days: 30

  build-macos:
    name: 构建 macOS 版本
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: 获取依赖
        run: flutter pub get
      
      - name: 构建 macOS 应用
        run: flutter build macos --release
      
      - name: 创建 DMG 镜像
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/fl_clash.app dmg/
          hdiutil create -volname "fl_clash" -srcfolder dmg -ov -format UDZO fl_clash-macos.dmg
      
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: fl_clash-macos.dmg
          retention-days: 30

  create-release:
    name: 创建 GitHub Release
    needs: [build-windows, build-android, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: 显示产物结构
        run: ls -R artifacts
      
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-release/fl_clash-windows-x64.zip
            artifacts/android-release/*.apk
            artifacts/android-release/*.aab
            artifacts/macos-release/fl_clash-macos.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
