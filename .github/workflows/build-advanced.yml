name: 高级多平台打包（带签名）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: '构建 Windows'
        type: boolean
        default: true
      build_android:
        description: '构建 Android'
        type: boolean
        default: true
      build_macos:
        description: '构建 macOS'
        type: boolean
        default: true
      create_release:
        description: '创建 GitHub Release'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.24.x'
  APP_NAME: 'fl_clash'

jobs:
  build-windows:
    name: 构建 Windows (x64)
    runs-on: windows-latest
    if: github.event.inputs.build_windows != 'false'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop
      
      - name: 获取依赖
        run: flutter pub get
      
      - name: 生成代码
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: 构建 Windows 应用
        run: flutter build windows --release --verbose
      
      - name: 创建便携版压缩包
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../${{ env.APP_NAME }}-windows-x64-portable.zip *
      
      - name: 创建安装器（可选 - 需要 Inno Setup）
        shell: pwsh
        continue-on-error: true
        run: |
          # 如果你有 Inno Setup 脚本，可以在这里添加
          Write-Host "跳过安装器创建 - 需要 Inno Setup 脚本"
      
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            ${{ env.APP_NAME }}-windows-x64-portable.zip
          retention-days: 30
          compression-level: 0

  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    if: github.event.inputs.build_android != 'false'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 获取依赖
        run: flutter pub get
      
      - name: 生成代码
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      # 如果有签名密钥，解码并使用
      - name: 解码 Android 签名密钥
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
      
      - name: 创建 key.properties
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
      
      - name: 构建 Android APK（多架构）
        run: flutter build apk --release --split-per-abi
      
      - name: 构建 Android APK（通用）
        run: flutter build apk --release
      
      - name: 构建 Android App Bundle
        run: flutter build appbundle --release
      
      - name: 整理产物
        run: |
          mkdir -p artifacts/apk
          mkdir -p artifacts/bundle
          
          # 复制分架构 APK
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} artifacts/apk/ \;
          
          # 重命名为更友好的名称
          cd artifacts/apk
          for file in app-*-release.apk; do
            if [ -f "$file" ]; then
              newname=$(echo "$file" | sed "s/app-/${{ env.APP_NAME }}-/")
              mv "$file" "$newname"
            fi
          done
          
          # 复制 AAB
          cd ../..
          cp build/app/outputs/bundle/release/app-release.aab artifacts/bundle/${{ env.APP_NAME }}.aab || true
      
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: artifacts/apk/*.apk
          retention-days: 30
      
      - name: 上传 AAB 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle-release
          path: artifacts/bundle/*.aab
          retention-days: 30

  build-macos:
    name: 构建 macOS (Universal)
    runs-on: macos-latest
    if: github.event.inputs.build_macos != 'false'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 启用 macOS 桌面支持
        run: flutter config --enable-macos-desktop
      
      - name: 获取依赖
        run: flutter pub get
      
      - name: 生成代码
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: 构建 macOS 应用
        run: flutter build macos --release
      
      # 代码签名（需要配置证书）
      - name: 代码签名
        if: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
        continue-on-error: true
        run: |
          echo "代码签名步骤 - 需要配置证书和密钥"
          # 这里可以添加 codesign 命令
      
      - name: 创建 DMG 镜像
        run: |
          # 创建临时目录
          mkdir -p dmg_temp
          
          # 复制应用
          cp -R build/macos/Build/Products/Release/${{ env.APP_NAME }}.app dmg_temp/
          
          # 创建符号链接到应用程序文件夹
          ln -s /Applications dmg_temp/Applications
          
          # 创建 DMG
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            ${{ env.APP_NAME }}-macos-universal.dmg
      
      - name: 创建 ZIP 压缩包
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../${{ env.APP_NAME }}-macos-universal.zip ${{ env.APP_NAME }}.app
      
      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-release
          path: ${{ env.APP_NAME }}-macos-universal.dmg
          retention-days: 30
      
      - name: 上传 macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-release
          path: ${{ env.APP_NAME }}-macos-universal.zip
          retention-days: 30

  create-release:
    name: 创建 GitHub Release
    needs: [build-windows, build-android, build-macos]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true')
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 获取版本号
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号: $VERSION"
      
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: 显示产物结构
        run: |
          echo "=== 产物目录结构 ==="
          ls -R release-artifacts
      
      - name: 整理发布文件
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.zip" -o -name "*.apk" -o -name "*.aab" -o -name "*.dmg" \) -exec cp {} release-files/ \;
          echo "=== 发布文件 ==="
          ls -lh release-files
      
      - name: 生成更新日志
        id: changelog
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## 📦 ${{ steps.get_version.outputs.version }} 版本发布
          
          ### 🎉 多平台支持
          
          - ✅ **Windows** (x64) - 便携版
          - ✅ **Android** (arm64-v8a, armeabi-v7a, x86_64) - APK 和 AAB
          - ✅ **macOS** (Universal) - DMG 和 ZIP
          
          ### 📥 下载说明
          
          **Windows 用户:**
          - 下载 `fl_clash-windows-x64-portable.zip`
          - 解压后直接运行
          
          **Android 用户:**
          - 推荐下载 `fl_clash-arm64-v8a-release.apk`（适用于大多数现代设备）
          - 如果是旧设备，选择 `fl_clash-armeabi-v7a-release.apk`
          
          **macOS 用户:**
          - 下载 `fl_clash-macos-universal.dmg`
          - 打开 DMG 并拖动到应用程序文件夹
          
          ### 🔄 完整更新日志
          
          EOF
          
          # 如果有 Git 标签，添加提交历史
          if git describe --tags --abbrev=0 2>/dev/null; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "**更改自 $PREV_TAG:**" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
              git log $PREV_TAG..HEAD --pretty=format:"- %s (%an)" >> RELEASE_NOTES.md
            fi
          fi
          
          cat RELEASE_NOTES.md
      
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ env.APP_NAME }} ${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 发布成功通知
        run: |
          echo "🎉 发布成功！"
          echo "版本: ${{ steps.get_version.outputs.version }}"
          echo "查看发布: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }}"
